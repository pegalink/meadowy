# Fly.io config. First-time setup (one-time, from this directory):
#
#   fly launch --no-deploy         # picks up this file, asks to confirm the app name
#   fly volumes create meadowy_data --size 1 --region <your region>
#   fly secrets set FLASK_SECRET_KEY=$(python3 -c "import secrets; print(secrets.token_hex(32))")
#   fly deploy
#   fly certs add meadowy.roboticrobot.xyz     # then add the CNAME it gives you at your DNS provider
#
# Change `app` below to whatever name you confirm during `fly launch`.

app = "meadowy"
primary_region = "fra"

[build]

[env]
  PORT = "8080"
  MEADOWS_DATA_DIR = "/data"

[[mounts]]
  source = "meadowy_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
